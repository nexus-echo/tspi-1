# TSPI AI Platform — Production Docker Compose
#
# Services:
#   • tspi-db  — private PostgreSQL + pgvector
#   • tspi-api — private FastAPI AI engine
#   • tspi-mcp — public MCP server
#
# External:
#   • Ollama running remotely on the user's GPU/local machine via Tailscale
#
# No Supabase.
# No Ollama container.
# No host ports.

services:

  # ============================================================
  # TSPI DATABASE — PRIVATE
  # PostgreSQL + pgvector
  # ============================================================
  tspi-db:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: tspi
      POSTGRES_PASSWORD: ${TSPI_DB_PASSWORD:?}
      POSTGRES_DB: tspi

    volumes:
      - tspi_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspi -d tspi"]
      interval: 5s
      timeout: 3s
      retries: 12

    restart: unless-stopped


  # ============================================================
  # TSPI AI BRAIN — PRIVATE
  # ============================================================
  tspi-api:
    build:
      context: ./apps/ai-engine

    environment:
      DATABASE_URL: postgresql+psycopg://tspi:${TSPI_DB_PASSWORD:?}@tspi-db:5432/tspi

    ports:
      - "8000:8000"

    expose:
      - "8000"

    depends_on:
      tspi-db:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # TSPI MCP SERVER — PUBLIC
  # ============================================================
  tspi-mcp:
    build:
      context: ./apps/tspi-mcp

    environment:
      TSPI_ENGINE_URL: http://tspi-api:8000
      TSPI_MCP_TRANSPORT: streamable-http
      TSPI_MCP_PORT: "8080"

    # Other secrets/configuration should be configured in Coolify,
    # for example OAuth/authentication settings.

    ports:
      - "8080:8080"

    expose:
      - "8080"

    depends_on:
      tspi-api:
        condition: service_started

    restart: unless-stopped


# ============================================================
# PERSISTENT DATABASE STORAGE
# ============================================================
volumes:
  tspi_pgdata:
