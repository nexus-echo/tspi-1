services:

  # ---------------- TSPI AI brain database ----------------
  tspi-db:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: tspi
      POSTGRES_PASSWORD: ${TSPI_DB_PASSWORD:-tspi}
      POSTGRES_DB: tspi

    volumes:
      - tspi_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspi -d tspi"]
      interval: 5s
      timeout: 3s
      retries: 12

    restart: unless-stopped


  # ---------------- TSPI AI brain ----------------
  tspi-api:
    build: ./apps/ai-engine

    env_file:
      - ./apps/ai-engine/.env

    environment:
      TSPI_ENV: prod

      DATABASE_URL: postgresql+psycopg://tspi:${TSPI_DB_PASSWORD:-tspi}@tspi-db:5432/tspi

      # Remote Ollama running on local WSL2 through Tailscale.
      OLLAMA_BASE_URL: http://100.121.11.25:11434

      # Primary local LLM.
      OLLAMA_MODEL: qwen3:8b

      # Embedding model.
      OLLAMA_EMBEDDING_MODEL: bge-m3

      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

    ports:
      - "8002:8000"

    depends_on:
      tspi-db:
        condition: service_healthy

    restart: unless-stopped


  # ---------------- MiHealth portal database ----------------
  mihealth-db:
    image: postgres:15

    environment:
      POSTGRES_USER: mihealth
      POSTGRES_PASSWORD: ${MIHEALTH_DB_PASSWORD:-mihealth}
      POSTGRES_DB: mihealth

    volumes:
      - mihealth_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mihealth"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


  # ---------------- MiHealth API ----------------
  mihealth-api:
    build: ./apps/mihealth-backend

    depends_on:
      mihealth-db:
        condition: service_healthy

      tspi-api:
        condition: service_started

    environment:
      DATABASE_URL: postgresql+psycopg2://mihealth:${MIHEALTH_DB_PASSWORD:-mihealth}@mihealth-db:5432/mihealth

      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}

      TSPI_BASE_URL: http://tspi-api:8000

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@mihealth.app}

      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}

      SEED_ADMIN_NAME: Default Admin

      CORS_ORIGINS: http://localhost:5173

      UPLOAD_DIR: /data/uploads

      OCR_USE_LLM: "false"

    volumes:
      - mihealth_uploads:/data/uploads

    ports:
      - "8001:8001"

    restart: unless-stopped


  # ---------------- MiHealth Web UI ----------------
  mihealth-web:
    build: ./apps/mihealth-frontend

    depends_on:
      - mihealth-api

    environment:
      VITE_API_TARGET: http://mihealth-api:8001

    ports:
      - "5173:5173"

    restart: unless-stopped


# ---------------- Persistent storage ----------------
volumes:
  tspi_pgdata:
  mihealth_pgdata:
  mihealth_uploads:
