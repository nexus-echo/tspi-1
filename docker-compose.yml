# TSPI AI platform — the SINGLE Docker Compose for this repo (engine + MCP only).
#
# Why no database container:
#   • LOCAL dev  -> built-in SQLite (data/tspi.db), zero-config. Leave DATABASE_URL unset.
#   • PRODUCTION -> Supabase Postgres (pgvector). Set DATABASE_URL to the Supabase pooler conn.
#   Neither environment uses a bundled Postgres, so there is no `db` service here.
#
# Why no Ollama container:
#   Ollama is an EXTERNAL service in BOTH environments — never containerised here:
#   • LOCAL      -> your own Ollama at http://localhost:11434 (or http://host.docker.internal:11434
#                   from inside the container).
#   • PRODUCTION -> the GPU box reached over Tailscale (e.g. http://100.121.11.25:11434).
#   Point OLLAMA_BASE_URL at it in apps/ai-engine/.env.
#
# So this file only builds the two application services. Everything environment-specific
# (DATABASE_URL, OLLAMA_BASE_URL, AUTH_ENABLED, secrets, ...) comes from the per-app .env files.
#
#   cp apps/ai-engine/.env.example apps/ai-engine/.env     # fill in values
#   cp apps/tspi-mcp/.env.example  apps/tspi-mcp/.env
#   docker compose up -d --build
#   open http://localhost:8002/docs        # engine (Swagger)
#   MCP:  http://localhost:8080            # public surface (OAuth required in prod)

services:

  # ---------------- TSPI AI brain (FastAPI engine) — PRIVATE in production ----------------
  tspi-api:
    build: ./apps/ai-engine

    # All config/secrets come from here. For local docker with SQLite, DATABASE_URL can stay
    # unset. For prod, set DATABASE_URL (Supabase) + OLLAMA_BASE_URL (Tailscale) + AUTH_ENABLED
    # etc. In Coolify these are set as service secrets instead of an .env file.
    env_file:
      - ./apps/ai-engine/.env

    ports:
      - "8002:8000"          # engine Swagger at http://localhost:8002/docs

    restart: unless-stopped


  # ---------------- TSPI MCP server — PUBLIC surface for AI chat clients (OAuth) ----------------
  tspi-mcp:
    build: ./apps/tspi-mcp

    env_file:
      - ./apps/tspi-mcp/.env

    environment:
      TSPI_ENGINE_URL: http://tspi-api:8000     # reach the engine on the internal network only
      TSPI_MCP_TRANSPORT: streamable-http
      TSPI_MCP_PORT: "8080"
      # OAuth is REQUIRED when this is publicly exposed — set TSPI_MCP_AUTH (jwt|workos) in .env.

    ports:
      - "8080:8080"

    depends_on:
      tspi-api:
        condition: service_started

    restart: unless-stopped


# Deployment note (Coolify): expose ONLY tspi-mcp (public, OAuth) and the MiHealth web app
# (which now lives in its own repo). Keep tspi-api (the engine) PRIVATE — no public route.
# External services in prod: Supabase Postgres (DATABASE_URL) and Tailscale Ollama
# (OLLAMA_BASE_URL). See docs/01-plans/TSPI_Deploy_Runbook_Coolify.md.
