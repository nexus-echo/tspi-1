services:

  # ---------------- TSPI AI brain database ----------------
  tspi-db:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: tspi
      POSTGRES_PASSWORD: ${TSPI_DB_PASSWORD:-tspi}
      POSTGRES_DB: tspi

    volumes:
      - tspi_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspi -d tspi"]
      interval: 5s
      timeout: 3s
      retries: 12

    restart: unless-stopped


  # ---------------- TSPI AI brain (FastAPI engine) ----------------
  tspi-api:
    build: ./apps/ai-engine

    env_file:
      - ./apps/ai-engine/.env

    environment:
      TSPI_ENV: prod

      DATABASE_URL: postgresql+psycopg://tspi:${TSPI_DB_PASSWORD:-tspi}@tspi-db:5432/tspi

      # Remote Ollama running on local WSL2 through Tailscale.
      OLLAMA_BASE_URL: http://100.121.11.25:11434

      # Primary local LLM.
      OLLAMA_MODEL: qwen3:8b

      # Embedding model.
      OLLAMA_EMBEDDING_MODEL: bge-m3

      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}

    ports:
      - "8002:8000"

    depends_on:
      tspi-db:
        condition: service_healthy

    restart: unless-stopped


  # ---------------- TSPI MCP server (public surface for AI chat clients) ----------------
  tspi-mcp:
    build: ./apps/tspi-mcp

    env_file:
      - ./apps/tspi-mcp/.env

    environment:
      TSPI_ENGINE_URL: http://tspi-api:8000     # engine stays PRIVATE (internal only)
      TSPI_MCP_TRANSPORT: streamable-http
      TSPI_MCP_PORT: "8080"
      # OAuth is REQUIRED when this is publicly exposed — set TSPI_MCP_AUTH in .env (jwt|workos).

    ports:
      - "8080:8080"

    depends_on:
      tspi-api:
        condition: service_started

    restart: unless-stopped


# The MiHealth portal (frontend + backend) now lives in its own repo. It reaches this engine
# over HTTP via TSPI_BASE_URL; see docs/01-plans/TSPI_MiHealth_Repo_Split_Plan.md.
#
# Deployment note (Coolify): expose ONLY tspi-mcp (public, OAuth) and MiHealth web. Keep tspi-api
# (the engine) and tspi-db PRIVATE — no public route. See docs/01-plans/TSPI_Deploy_Runbook_Coolify.md.

# ---------------- Persistent storage ----------------
volumes:
  tspi_pgdata:
