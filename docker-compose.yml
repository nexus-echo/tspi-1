# TSPI AI Platform — Production Docker Compose
#
# Services:
#   • tspi-api — private FastAPI AI engine
#   • tspi-mcp — public MCP server via Coolify reverse proxy
#
# External production services:
#   • Supabase Postgres / pgvector
#   • Ollama running remotely on the user's GPU/local machine via Tailscale
#
# IMPORTANT:
#   • No database container is deployed here.
#   • No Ollama container is deployed here.
#   • No fixed VPS host ports are published.
#   • Coolify environment variables/secrets provide production configuration.
#   • Only tspi-mcp should receive a public Coolify domain.
#   • tspi-api remains private on the Docker network.

services:

  # ============================================================
  # TSPI AI BRAIN — FastAPI Engine
  # PRIVATE: internal Docker network only
  # ============================================================
  tspi-api:
    build:
      context: ./apps/ai-engine

    # Production configuration is injected by Coolify.
    #
    # Examples:
    # DATABASE_URL
    # OLLAMA_BASE_URL
    # AUTH_ENABLED
    # API secrets
    #
    # Do NOT use env_file here unless the .env file is actually
    # present inside the Git repository.

    expose:
      - "8000"

    restart: unless-stopped


  # ============================================================
  # TSPI MCP SERVER
  # PUBLIC: expose through Coolify reverse proxy/domain only
  # ============================================================
  tspi-mcp:
    build:
      context: ./apps/tspi-mcp

    environment:
      # Internal Docker networking.
      # The MCP server communicates directly with the AI engine.
      TSPI_ENGINE_URL: http://tspi-api:8000

      # MCP transport configuration.
      TSPI_MCP_TRANSPORT: streamable-http
      TSPI_MCP_PORT: "8080"

    # Other secrets/configuration should be configured in Coolify,
    # for example OAuth/authentication settings.

    expose:
      - "8080"

    depends_on:
      tspi-api:
        condition: service_started

    restart: unless-stopped
